name: Latest Versions
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: ghcr.io/geocompx/python:latest
    defaults:
      run:
        shell: bash -l {0}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          # Upgrade all packages in requirements.txt to latest compatible versions using uv (or pip fallback)
          if command -v uv >/dev/null 2>&1; then
            uv pip install --system --upgrade --no-cache -r requirements.txt
          else
            pip install -U --upgrade-strategy eager -r requirements.txt
          fi
      - name: Render
        run: |
          # test code:
          quarto render
          ls docs
